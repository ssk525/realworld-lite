name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          DATABASE_URL: sqlite://
          SECRET_KEY: ci-secret
          RATE_LIMIT: 1000/minute
        run: pytest -q

      - name: Alembic upgrade (sqlite)
        env:
          DATABASE_URL: sqlite:///./ci.db
          SECRET_KEY: ci-secret
          AUTO_CREATE_TABLES: "false"
        run: alembic upgrade head

  postgres:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: realworld
          POSTGRES_PASSWORD: realworld
          POSTGRES_DB: realworld
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U realworld"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://realworld:realworld@localhost:5432/realworld
      SECRET_KEY: ci-secret
      AUTO_CREATE_TABLES: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Alembic upgrade, downgrade, upgrade (PostgreSQL 16)
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Smoke test the API against PostgreSQL
        run: |
          uvicorn app.main:app --port 8000 &
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/api/users -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","username":"ci","password":"secret12"}' > reg.json
          TOKEN=$(python -c "import json;print(json.load(open('reg.json'))['access_token'])")
          curl -sf -X POST localhost:8000/api/articles -H "Authorization: Bearer $TOKEN" \
            -H 'Content-Type: application/json' \
            -d '{"title":"CI post","description":"","body":"x","tag_list":["ci"]}'
          curl -sf "localhost:8000/api/articles?tag=ci" | python -c "import json,sys;assert json.load(sys.stdin)['meta']['total']==1"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t realworld-lite .
      - name: Compose up and health check
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 2; done
          curl -sf localhost:8000/health
          docker compose down -v
